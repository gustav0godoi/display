<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HubIA - Inteligência Artificial</title>

    <link rel="stylesheet" href="./css/reset.css">
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            padding: 20px;
            background-color: olive;
            color: white;
            font-family: Arial, sans-serif;
            height: 300vh;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }


        .container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .box {
            max-width: 400px;
            height: 200px;
            background-color: black;
        }


        body{
            background-color: olive;
            color: white;
        }
        
        .container-position{
            margin-top: 10px;
            width: 100%;
            height: 600px;
            border: 2px solid blueviolet;
            position: relative;
        }

        .filho-tamanho{
            position: absolute;
            width: 200px;
            height: 150px;
            background-color: purple;
        }

        .container-position__filho01{
            top: 0;
            left: 0;
        }

        .container-position__filho02{
            top: 0;
            right: 0;
        }

        .container-position__filho03{
            bottom: 0;
            left: 0;
        }

        .container-position__filho04{
            bottom: 0;
            right: 0
        }

        .whats {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: rgb(69, 223, 30);
            border: 2px solid white;
            box-shadow: 1px 2px 7px white;
            position: fixed;
            right: 60px;
            bottom: 45px;
        }

        .whats img{
            width: 75px;
            height: 75px;

        }


        @media(min-width: 768px) {
        body {
        background-color: blue;
        color: white;
            }
         
            .box{
            width: 45%;
            max-width: 600px;
            }   
      

        }

        @media(min-width: 992px) {
            body {
                background-color: tan;
                color: black;
            }

            .box{
            width: 300px;
            }   

        }
    </style>


</head>

<body>
 <h1>Este é um teste de @Media</h1>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <div class="container-position">
        <div class="container-position__filho01 filho-tamanho"></div>
        <div class="container-position__filho02 filho-tamanho"></div>
        <div class="container-position__filho03 filho-tamanho"></div>
        <div class="container-position__filho04 filho-tamanho"></div>
    </div>
    <div class="whats">
        <img src="./img/whatsapp.png" alt="">


    </div>

</body>

</html>
